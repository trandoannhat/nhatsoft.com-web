name: Deploy Nhatsoft Web

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # ✅ Install & build trên GitHub (VPS yếu)
      - name: Install dependencies and Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      # ✅ Deploy build artifacts lên VPS
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 24700
          source: ".next,public,package.json,package-lock.json,next.config.*"
          target: "/var/www/nhatsoft.com"
          strip_components: 0

      # ✅ SSH vào VPS để start/reload PM2
      - name: Start / Reload PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 24700
          script: |
            set -e

            cd /var/www/nhatsoft.com

            # ✅ Chỉ cài production deps (KHÔNG build lại)
            npm install --omit=dev

            # ✅ Reload PM2
            PORT=3004 pm2 reload nhatsoft-web || PORT=3004 pm2 start npm --name "nhatsoft-web" -- start

            # ✅ Lưu trạng thái
            pm2 save
