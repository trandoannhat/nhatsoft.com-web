name: Deploy Nhatsoft Web

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 3. Cài deps + build trên GitHub (máy mạnh)
      - name: Install dependencies and Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      # 4. Copy toàn bộ build + deps lên VPS
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 24700
          source: ".next,public,node_modules,package.json,package-lock.json,next.config.*"
          target: "/var/www/nhatsoft.com"
          strip_components: 0

      # 5. Reload PM2 (KHÔNG build lại, KHÔNG install)
      - name: Start / Reload PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 24700
          script: |
            set -e

            cd /var/www/nhatsoft.com

            # 🔥 Reload app với build mới
            PORT=3004 pm2 reload nhatsoft-web || PORT=3004 pm2 start npm --name "nhatsoft-web" -- start

            pm2 save
